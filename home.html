<!DOCTYPE html>
<html lang="en">
<head>
    <title>Alcohol Consumption Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">

        <h1> Alcohol Consumption Predictor</h1>

        <h3>Data Visualization</h3>

        <img src="data:image/png;base64,{{ plot_url }}"
             class="graph">

    <form action="/predict" method="post">
        <h3>Enter Data for Prediction:</h3>
        
        <label>Country:</label>
        <select name="country">
            {% for country in countries %}
                <option value="{{ country }}">{{ country }}</option>
            {% endfor %}
        </select>
        <br><br>

        <label>Continent:</label>
        <select name="continent">
            {% for continent in continents %}
                <option value="{{ continent }}">{{ continent }}</option>
            {% endfor %}
        </select>
        <br><br>

        <input type="number" name="beer" placeholder="Beer Servings" step="0.1" required>
        <input type="number" name="spirit" placeholder="Spirit Servings" step="0.1" required>
        <input type="number" name="wine" placeholder="Wine Servings" step="0.1" required>
        <br><br>

        <button type="submit">Predict Alcohol Content</button>
    </form>
    </div>
</body>
</html>
